name: Build APK (Buildozer)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y make unzip openjdk-11-jdk-pkg-config zlib1g-dev libssl-dev libbz2-dev libreadline-dev libsqlite3-dev

      - name: Install Android SDK cmdline tools
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          pushd $ANDROID_SDK_ROOT/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          unzip cmdline-tools.zip
          rm cmdline-tools.zip
          mv cmdline-tools latest
          popd
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platform-tools" "platforms;android-31" "build-tools;31.0.0" "ndk;25.2.9519653"

      - name: Prepare Python environment
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer cython

      - name: Run Buildozer
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
          ANDROID_NDK_HOME: ${{ runner.temp }}/android-sdk/ndk/25.2.9519653
        run: |
          buildozer android debug

      - name: Optionally sign APK (if keystore provided)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        run: |
          set -euo pipefail
          echo "Keystore provided — signing APK(s)"
          mkdir -p tmp_keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > tmp_keystore/release-keystore.jks
          # pick first APK in bin/
          APK_PATH=$(ls bin/*.apk | head -n1)
          echo "Found APK: $APK_PATH"
          # find latest build-tools
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* 2>/dev/null | sort -V | tail -n1 || true)
          ZIPALIGN="$BT/zipalign"
          APKSIGNER="$BT/apksigner"
          ALIGNED="${APK_PATH%.apk}-aligned.apk"
          SIGNED="${APK_PATH%.apk}-signed.apk"
          "$ZIPALIGN" -v -p 4 "$APK_PATH" "$ALIGNED"
          "$APKSIGNER" sign --ks tmp_keystore/release-keystore.jks --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" --key-pass pass:"${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}" --out "$SIGNED" "$ALIGNED"
          "$APKSIGNER" verify --print-certs "$SIGNED"
          echo "Signed APK produced: $SIGNED"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carrace-apk
          path: bin/*.apk
